# Verificação semanal: o que vem de fora continua igual, navegadores novos, fuzz longo,
# site no ar igual à Release e OpenSSF Scorecard. Abre uma issue se algo falhar.
name: Semanal

on:
  schedule:
    - cron: '0 9 * * 1' # segunda-feira, 6h em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  externos:
    name: SheetJS e lista do IBGE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/ci/conferir-externos.mjs

  auditoria:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # O app não tem dependências npm em execução (o SheetJS vai embutido e conferido por hash);
      # a auditoria cobre as ferramentas de build e teste.
      - run: npm audit --audit-level=high

  navegadores-novos:
    name: Navegadores com o Playwright mais recente
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts @playwright/test@latest @axe-core/playwright@latest
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/build.mjs
      - run: node scripts/gerar-fixtures.mjs
      # Capturas de tela ficam de fora: navegador novo muda a renderização sem ser erro do app.
      - run: npx playwright test --grep-invert @visual
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorio-navegadores-novos
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  fuzz-longo:
    name: Fuzz de 30 minutos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/integ/fuzz.test.mjs
        env:
          FUZZ_CASOS: '30000'
          FUZZ_SEMENTE: ${{ github.run_id }}

  desempenho-inteiro:
    name: Arquivo inteiro com 67 mil linhas × 86 colunas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/integ/desempenho-inteiro.test.mjs
        env:
          DESEMPENHO_INTEIRO_LINHAS: '67000'
          DESEMPENHO_INTEIRO_COLUNAS: '86'
          DESEMPENHO_FATOR: '2'

  site-igual-release:
    name: Site no ar = arquivo da última Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comparar hashes
        env:
          GH_TOKEN: ${{ github.token }}
          # Se usar domínio próprio, defina a variável do repositório URL_SITE.
          URL_SITE: ${{ vars.URL_SITE }}
          DONO: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if ! tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null); then
            echo "Ainda não há Release publicada; nada a comparar."; exit 0
          fi
          url="${URL_SITE:-https://${DONO,,}.github.io/${REPO}/}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/rel"
          esperado=$(grep ' gerador-planilhas-exemplo.html$' "$RUNNER_TEMP/rel/SHA256SUMS" | cut -d' ' -f1)
          no_ar=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          echo "Release $tag: $esperado"
          echo "Site $url: $no_ar"
          if [ "$esperado" != "$no_ar" ]; then echo "::error::O site no ar é diferente do arquivo da Release $tag"; exit 1; fi
          if grep -q ' gerador-planilhas-exemplo.zip$' "$RUNNER_TEMP/rel/SHA256SUMS"; then
            zip_esperado=$(grep ' gerador-planilhas-exemplo.zip$' "$RUNNER_TEMP/rel/SHA256SUMS" | cut -d' ' -f1)
            zip_no_ar=$(curl -fsSL "${url}gerador-planilhas-exemplo.zip" | sha256sum | cut -d' ' -f1)
            echo "Pacote .zip no site: $zip_no_ar"
            if [ "$zip_esperado" != "$zip_no_ar" ]; then echo "::error::O .zip do site é diferente do da Release $tag"; exit 1; fi
          fi

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  avisar:
    name: Abrir issue se algo falhou
    needs: [externos, auditoria, navegadores-novos, fuzz-longo, desempenho-inteiro, site-igual-release, scorecard]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Verificação semanal falhou ($(date -u +%Y-%m-%d))" \
            --body "Algum passo da verificação semanal falhou. Detalhes: $EXECUCAO"
