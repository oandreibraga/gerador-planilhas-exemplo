# Publicação de uma versão: ao criar a tag vX.Y.Z, roda toda a verificação, monta o arquivo,
# publica a Release (HTML + SHA256SUMS + SBOM + atestado de proveniência) e atualiza o site.
# O site recebe exatamente o mesmo arquivo da Release (mesmo hash).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  publicar:
    name: Montar e publicar a Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build com a versão da tag
        run: |
          echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          VERSAO="${GITHUB_REF_NAME#v}" node scripts/build.mjs
      - run: node scripts/sbom.mjs dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/gerador-planilhas-exemplo.html
            dist/index.html
      - name: Notas da versão (seção do CHANGELOG.md)
        run: |
          awk -v v="$VERSAO" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
            dentro && /^## / { exit }
            dentro { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          if [ ! -s "$RUNNER_TEMP/notas.md" ]; then echo "Veja o CHANGELOG.md." > "$RUNNER_TEMP/notas.md"; fi
          {
            echo ""
            echo "### Conferir o arquivo baixado"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo "Proveniência: \`gh attestation verify gerador-planilhas-exemplo.html --repo $GITHUB_REPOSITORY\`"
          } >> "$RUNNER_TEMP/notas.md"
      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/gerador-planilhas-exemplo.html dist/testes.html dist/SHA256SUMS dist/sbom.cdx.json \
            --repo "$GITHUB_REPOSITORY" --title "Gerador de planilhas de exemplo $VERSAO" --notes-file "$RUNNER_TEMP/notas.md" --verify-tag
      - name: Preparar o site
        run: |
          mkdir -p site
          cp dist/index.html dist/gerador-planilhas-exemplo.html dist/SHA256SUMS site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  site:
    name: Atualizar o site (GitHub Pages)
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ambiente protegido: configure em Settings > Environments quem aprova a publicação.
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
